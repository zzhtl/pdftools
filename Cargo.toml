[workspace]
members = ["crates/pdfcore", "crates/pdftools"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/zzhtl/pdftools"

[workspace.dependencies]
anyhow = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
