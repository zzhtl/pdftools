name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: 检查与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: 安装中文字体
        # runner 默认不带 CJK 字体。没有它，docx 排版测试无字体可用，
        # 测的就不是真实行为了。macOS 与 Windows 自带中文字体，无需此步。
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets

      - name: 测试
        id: test
        # 核心逻辑全在 pdfcore 里，它不链接任何 GUI 库，
        # 所以在没有显示器的 runner 上也能完整跑。
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test-output.log

      - name: 列出失败的测试
        # Actions 的日志要登录才能看；把失败的用例和断言信息写成检查注解，
        # 在提交页和公开 API 里直接可见。
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          grep -E -A8 '^---- .* stdout ----' test-output.log \
            | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r$//' | head -120 > failures.txt || true
          body=$(sed -e 's/%/%25/g' failures.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=失败的测试 (${{ matrix.os }})::${body}"
