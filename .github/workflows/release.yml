name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 而不是 latest：用较老的 glibc 构建，产物才能在更旧的
          # 发行版上跑起来；反过来则不行。
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # 只出 Apple Silicon。Intel Mac 不再提供预编译包，
          # 需要的话从源码构建即可（见 README）。
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: 校验 tag 与 Cargo.toml 版本一致
        # 版本号漂移过一次：tag 已经打到 v0.3.1，Cargo.toml 还停在 0.1.0。
        # 对 .deb 来说这很要命 —— apt 靠它判断升级，装了新版也认不出来。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$tag  Cargo.toml=$crate"
          [ "$tag" = "$crate" ] || {
            echo "::error::tag 版本 $tag 与 Cargo.toml 的 $crate 不一致，请先同步再打 tag"
            exit 1
          }

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }} -p pdftools

      # ---------------------------------------------------------------- Linux
      # 产物是 Ubuntu / Debian 原生包：apt install ./xxx.deb 即可，
      # 装完在应用菜单里能直接找到，也能用「打开方式」关联文件。
      #
      # 在 ubuntu-22.04 上构建是有意的：deb 会把构建机的 libc6 版本写进 Depends，
      # 在 24.04 上构建出来的包在 22.04 上装不了，反过来可以。
      - name: 打包 deb
        if: runner.os == 'Linux'
        run: |
          set -eux
          cargo install cargo-deb --locked --version '^3'
          cargo deb -p pdftools --no-build --output .
          ls -la ./*.deb
          # 依赖里必须有那些运行时 dlopen 的库，否则装上也起不来
          deb=$(ls ./*.deb | head -1)
          dpkg -I "$deb" | grep -q 'libgl1' || {
            echo "::error::Depends 里缺少 libgl1，包装错了"; exit 1; }
          dpkg -I "$deb"

      # ---------------------------------------------------------------- macOS
      # 产物是 .dmg：双击挂载，把 pdftools 拖进 Applications 即完成安装。
      - name: 打包 dmg
        if: runner.os == 'macOS'
        run: |
          set -eux
          APP="dist/pdftools.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/pdftools "$APP/Contents/MacOS/"

          # iconutil 只认这一组固定文件名，多一个 icon_64x64.png 之类的都会让它报错。
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
          done
          for s in 16 32 128 256; do
            d=$((s * 2))
            sips -z $d $d assets/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/pdftools.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>pdftools</string>
            <key>CFBundleDisplayName</key><string>pdftools</string>
            <key>CFBundleIdentifier</key><string>io.github.zzhtl.pdftools</string>
            <key>CFBundleExecutable</key><string>pdftools</string>
            <key>CFBundleIconFile</key><string>pdftools</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          # 放一个 Applications 的快捷方式，挂载后直接拖过去就装好了
          ln -s /Applications dist/Applications
          cp README.md dist/
          hdiutil create -volname "pdftools" -srcfolder dist -ov -format UDZO \
            "pdftools-${{ matrix.name }}.dmg"

      # -------------------------------------------------------------- Windows
      # 产物就是 exe 本身：下载即可双击运行，不用解压。
      - name: 准备 exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/pdftools.exe `
                    -Destination "pdftools-${{ matrix.name }}.exe"

      - name: 校验和
        shell: bash
        run: |
          set -eu
          # 每个平台只会产出三者之一，所以要跳过不存在的，
          # 否则 sha256sum 会因为文件缺失让整步失败。
          for f in ./*.deb \
                   pdftools-${{ matrix.name }}.dmg \
                   pdftools-${{ matrix.name }}.exe; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256";
            else shasum -a 256 "$f" > "$f.sha256"; fi
            echo "已生成 $f.sha256"
          done

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.deb
            *.deb.sha256
            pdftools-${{ matrix.name }}.dmg
            pdftools-${{ matrix.name }}.exe
            pdftools-${{ matrix.name }}.*.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
