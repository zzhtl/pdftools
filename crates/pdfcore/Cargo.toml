[package]
name = "pdfcore"
description = "pdftools 的核心逻辑：图像流水线、PDF 读写、docx 排版。不依赖任何 GUI。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# 图像。显式关掉 avif 与 exr：avif 的解码走 dav1d（C 依赖），exr 编译慢且用不到，
# 两者都只会让三平台 CI 更脆，而没人会拿 AVIF/EXR 转 PDF。
image = { version = "0.25.10", default-features = false, features = [
    "jpeg", "png", "gif", "bmp", "tiff", "webp", "ico", "pnm", "tga", "qoi",
] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
# simd：AVX2 的色彩转换与 DCT，运行时检测 CPU，不支持时自动用标量实现。
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
kamadak-exif = "0.6.1"
# lopdf 已经传递依赖了 chrono，直接用不增加编译成本
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

pdf-writer = "0.15.0"
lopdf = "0.45.0"
flate2 = "1"

fontdb = "0.24.0"
ttf-parser = "0.25.1"
rustybuzz = "0.20.1"
subsetter = "0.2.6"
unicode-linebreak = "0.1.5"
unicode-script = "0.5"

zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"

anyhow.workspace = true
log.workspace = true
rayon = "1"
thiserror = "2"

[dev-dependencies]
lopdf = "0.45.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
hayro = "0.7.1"
